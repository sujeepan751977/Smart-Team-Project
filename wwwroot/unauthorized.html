<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unauthorized · SMART RECRUIT</title>
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="/module1-core/module1.css" />
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="site-header"></div>
  <main class="container" style="padding:3rem 1rem">
    <div class="card" style="max-width:480px;margin:0 auto;text-align:center">
      <h1>Unauthorized</h1>
      <p class="muted" style="margin:0.8rem 0 1.2rem">You need to sign in to continue.</p>
      <a class="btn btn-primary" id="go-home" href="/login.html">Sign in</a>
    </div>
  </main>
  <script src="/shared/utils.js"></script>
  <script src="/shared/apiClient.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/guards.js"></script>
  <script src="/shared/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SR.ui.mountPublicHeader();
      if (SR.auth.isLoggedIn()) {
        const user = SR.auth.getUser();
        const btn = document.getElementById("go-home");
        if (btn) {
          btn.href = SR.auth.homeForRole(user?.role);
          btn.textContent = "Go to dashboard";
        }
      }
    });
  </script>
</body>
</html>

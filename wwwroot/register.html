<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · SMART RECRUIT</title>
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="/module1-core/module1.css" />
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="site-header"></div>
  <main class="container" style="padding:2rem 1rem 3rem">
    <div class="card" style="max-width:520px;margin:0 auto">
      <h1>Create your account</h1>
      <p class="muted" style="margin:0.4rem 0 0">Job Seeker is recommended if you are looking for roles.</p>
      <div class="tabs" id="role-tabs">
        <button type="button" class="active" data-role="JobSeeker">Job Seeker</button>
        <button type="button" data-role="Employer">Employer</button>
      </div>
      <div id="register-alert" class="alert error" hidden></div>
      <form id="register-form" class="form-grid">
        <label class="field">Full name <span class="req">*</span>
          <input name="fullName" required maxlength="100" />
        </label>
        <label class="field">Email <span class="req">*</span>
          <input name="email" type="email" required />
        </label>
        <label class="field">Password <span class="req">*</span> <span class="hint">min 8 characters</span>
          <input name="password" type="password" required minlength="8" autocomplete="new-password" />
        </label>
        <label class="field">Confirm password <span class="req">*</span>
          <input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" />
        </label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:1rem">Already registered? <a href="/login.html">Sign in</a></p>
    </div>
  </main>
  <script src="/shared/utils.js"></script>
  <script src="/shared/apiClient.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/guards.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/module1-core/module1.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · SMART RECRUIT</title>
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="/module1-core/module1.css" />
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div class="auth-split">
    <aside class="auth-brand">
      <a class="logo" href="/index.html">
        <span class="logo-mark">SR</span>
        <span class="logo-text">
          <span class="logo-text-main">SMART RECRUIT</span>
          <span class="logo-text-sub">Hiring platform</span>
        </span>
      </a>
      <h1>Welcome back</h1>
      <p>Sign in to continue discovering roles, managing applications, or hiring with clarity.</p>
    </aside>
    <main class="auth-panel">
      <div class="card auth-card">
        <h2>Sign in</h2>
        <p class="muted auth-lead">Use your Smart Recruit account.</p>
        <div id="login-alert" class="alert error" hidden></div>
        <form id="login-form" class="form-grid">
          <label class="field">
            <span class="field-label">Email <span class="req" aria-hidden="true">*</span></span>
            <input name="email" type="email" required autocomplete="username" placeholder="you@example.com" />
          </label>
          <label class="field">
            <span class="field-label">Password <span class="req" aria-hidden="true">*</span></span>
            <div class="password-wrap">
              <input name="password" id="login-password" type="password" required autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password" title="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-1.2M9.9 5.1A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-4.2 4.8M6.1 6.1C3.7 7.8 2 12 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.1-.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="muted auth-footer">New here? <a href="/register.html">Create an account</a></p>
      </div>
    </main>
  </div>
  <script src="/shared/utils.js"></script>
  <script src="/shared/apiClient.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/guards.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/module1-core/module1.js"></script>
</body>
</html>

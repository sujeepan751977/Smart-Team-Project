<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · SMART RECRUIT</title>
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="/module1-core/module1.css" />
</head>
<body>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div class="auth-split">
    <aside class="auth-brand">
      <a class="logo" href="/index.html"><span class="logo-mark">SR</span> SMART RECRUIT</a>
      <h1>Welcome back</h1>
      <p>Sign in to continue discovering roles, managing applications, or hiring with clarity.</p>
    </aside>
    <main class="auth-panel">
      <div class="card auth-card">
        <h2>Sign in</h2>
        <p class="muted" style="margin:0.4rem 0 1rem">Use your Smart Recruit account.</p>
        <div id="login-alert" class="alert error" hidden></div>
        <form id="login-form" class="form-grid">
          <label class="field">Email <span class="req">*</span>
            <input name="email" type="email" required autocomplete="username" />
          </label>
          <label class="field">Password <span class="req">*</span>
            <div class="password-wrap">
              <input name="password" id="login-password" type="password" required autocomplete="current-password" />
              <button type="button" class="btn btn-outline btn-sm" id="toggle-password">Show</button>
            </div>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
        <p class="muted" style="margin-top:1rem">New here? <a href="/register.html">Create an account</a></p>
      </div>
    </main>
  </div>
  <script src="/shared/utils.js"></script>
  <script src="/shared/apiClient.js"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/guards.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/module1-core/module1.js"></script>
</body>
</html>
